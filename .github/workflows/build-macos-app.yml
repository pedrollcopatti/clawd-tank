name: Build macOS App

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: host
        run: |
          pip install -r requirements.txt
          pip install py2app

      - name: Run tests
        working-directory: host
        run: python -m pytest -q

      # The app icon is the committed host/AppIcon.icns, which setup.py declares
      # as "iconfile".
      - name: Build .app with py2app
        working-directory: host
        run: python setup.py py2app

      - name: Create DMG
        working-directory: host
        run: |
          mkdir -p dmg-staging
          cp -R "dist/Clawd Tank.app" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Clawd Tank" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            "dist/Clawd-Tank.dmg"
          rm -rf dmg-staging

      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v7
        with:
          name: Clawd-Tank-macOS
          path: host/dist/Clawd-Tank.dmg

      - name: Upload DMG to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: host/dist/Clawd-Tank.dmg
